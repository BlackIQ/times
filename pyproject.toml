[project]
name = "nova_backend"
version = "0.1.0"
description = "Nova Blog by Amirhossein Media"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "fastapi[standard]>=0.140.0",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uuid>=1.30",
]

[tool.fastapi]
entrypoint = "main:app"
